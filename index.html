<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>홈</title>
  <meta name="description" content="학습 과정과 활동 기록을 꾸준히 정리하는 개인 블로그">
  <script>try{var t=localStorage.getItem("theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="home">
  <div id="header"></div>
  <main class="wrap">
    <section class="hero">
      <div class="eyebrow">안녕하세요</div>
      <h1><em data-site="name"></em>의 기록장</h1>
      <p><span data-site="tagline"></span><br><span data-site="intro"></span></p>
      <form class="searchbox" id="search-form" role="search">
        <label class="sr-only" for="search-q">글 검색</label>
        <input id="search-q" type="search" placeholder="글 검색 (제목, 태그, 요약)">
        <button class="btn primary" type="submit">검색</button>
      </form>
      <div class="tags" id="tags"></div>
    </section>

    <section class="block">
      <div class="sec-head"><h2>카테고리</h2></div>
      <div class="grid" id="cat-grid"></div>
    </section>

    <section class="block">
      <div class="sec-head"><h2>최근 글</h2><a href="category.html?c=all">전체 보기 →</a></div>
      <div id="recent"></div>
    </section>
  </main>
  <div id="footer"></div>
  <script src="posts.js"></script>
  <script src="app.js"></script>
</body>
</html>
