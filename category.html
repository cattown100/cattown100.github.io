<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>카테고리</title>
  <script>try{var t=localStorage.getItem("theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="category">
  <div id="header"></div>
  <main class="wrap">
    <section class="page-head">
      <h1 id="cat-title"></h1>
      <p id="cat-desc"></p>
      <div class="searchbox">
        <label class="sr-only" for="q">이 목록에서 검색</label>
        <input id="q" type="search" placeholder="이 목록에서 검색">
      </div>
      <div class="chips" id="tag-filter" style="padding-bottom:0"></div>
    </section>
    <section class="block" style="padding-top:8px">
      <div class="count-line" id="count"></div>
      <div id="cat-posts"></div>
    </section>
  </main>
  <div id="footer"></div>
  <script src="posts.js"></script>
  <script src="app.js"></script>
</body>
</html>
