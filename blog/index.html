<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>홈</title>
  <meta name="description" content="학습 과정과 활동 기록을 꾸준히 정리하는 개인 블로그">
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="home">
  <div id="header"></div>
  <main class="wrap">
    <section class="hero">
      <div class="prompt">$ whoami</div>
      <h1><em data-site="name"></em><span class="cursor"></span></h1>
      <p><span data-site="tagline"></span><br><span data-site="intro"></span></p>
      <div class="tags" id="tags"></div>
    </section>

    <section class="block">
      <h2 class="sec">categories</h2>
      <div class="grid" id="cat-grid"></div>
    </section>

    <section class="block">
      <h2 class="sec">recent posts</h2>
      <div id="recent"></div>
    </section>
  </main>
  <div id="footer"></div>
  <script src="posts.js"></script>
  <script src="app.js"></script>
</body>
</html>
